databases:
  - name: roblox2014-db
    plan: free
services:
  - type: web
    name: roblox2014
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: roblox2014-db
          property: connectionString
